name: Publish Daemon Client Package

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish from (e.g., cli@0.67.0)'
        required: false

permissions:
  contents: read

jobs:
  publish:
    name: Publish @ai-devkit/daemon-client to NPM
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build all packages
        run: npm run build

      - name: Pin devkitd platform packages
        working-directory: ./packages/daemon-client
        # Injected at publish time so dev installs never resolve the
        # unpublished platform packages. Version matches this package's —
        # publish-devkitd.yml stamps the same version on the binaries.
        run: |
          V=$(node -p "require('./package.json').version")
          for p in darwin-arm64 darwin-x64 linux-x64 linux-arm64; do
            npm pkg set "optionalDependencies.@ai-devkit/devkitd-$p=$V"
          done

      - name: Publish to NPM
        working-directory: ./packages/daemon-client
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
