name: Publish Pi Session Tracker Package

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Package version tag (e.g., pi-session-tracker-v0.1.0)'
        required: true

jobs:
  publish:
    name: Publish @ai-devkit/pi-session-tracker to NPM
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # No build step: this package publishes its plain-JS extensions/ sources directly.
      - name: Publish to NPM
        working-directory: ./packages/pi-session-tracker
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
