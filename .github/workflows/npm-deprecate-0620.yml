name: Remove broken 0.62.0 from npm

on:
  workflow_dispatch:

jobs:
  remove:
    name: Deprecate ai-devkit@0.62.0
    runs-on: ubuntu-latest

    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      - name: Deprecate ai-devkit@0.62.0
        run: npm deprecate ai-devkit@0.62.0 "Broken: pins @ai-devkit/agent-manager 0.32.0 which lacks required exports — fresh installs crash at startup. Use 0.62.1."
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
